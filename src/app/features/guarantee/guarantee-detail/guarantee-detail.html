<app-title [title]="'guarantee.detail.title' | transloco" [menu]="menu"></app-title>
<div class="flex flex-col gap-6 p-6 lg:px-8 bg-surface-50 dark:bg-surface-950 min-h-screen">

  <!-- Status Header -->
  <div class="bg-surface-0 dark:bg-surface-900 shadow-sm rounded-2xl p-5 border border-surface-200 dark:border-surface-700 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-12 h-12 rounded-xl bg-primary-50 dark:bg-primary-900/40 flex items-center justify-center text-primary-600 dark:text-primary-400">
        <i class="pi pi-file-check text-2xl"></i>
      </div>
      <div>
        <h2 class="text-sm text-surface-500 dark:text-surface-400">{{ 'guarantee.detail.status' | transloco }}</h2>
        <p class="text-lg font-bold text-surface-900 dark:text-surface-0">#{{ guaranteeForm.get('id')?.value }}</p>
      </div>
    </div>
    <p-tag [value]="getStatusLabel(guaranteeForm.get('status')?.value)" [severity]="getStatusSeverity(guaranteeForm.get('status')?.value)" [style]="{'padding': '0.5rem 1rem', 'font-size': '0.875rem'}"></p-tag>
  </div>

  <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
    <!-- Left column: Form -->
    <div class="xl:col-span-2 flex flex-col gap-6">
      <app-guarantee-form [guaranteeForm]="guaranteeForm" [isEdit]="isEdit"></app-guarantee-form>
    </div>

    <!-- Right column: Timeline -->
    <div class="xl:col-span-1">
      <div class="bg-surface-0 dark:bg-surface-900 shadow-sm rounded-2xl p-6 border border-surface-200 dark:border-surface-700 sticky top-6">
        <h3 class="text-lg font-bold text-surface-900 dark:text-surface-0 mb-6 flex items-center gap-2 pb-4 border-b border-surface-100 dark:border-surface-800">
          <i class="pi pi-history text-primary-500"></i>
          {{ 'guarantee.detail.timeline.title' | transloco }}
        </h3>

        <p-timeline [value]="timelineEvents">
          <ng-template pTemplate="marker" let-event>
            <span class="flex w-8 h-8 items-center justify-center text-white rounded-full z-10 shadow-sm" [ngClass]="getMarkerClass(event.status)">
              <i [class]="getMarkerIcon(event.status) + ' text-sm'"></i>
            </span>
          </ng-template>

          <ng-template pTemplate="content" let-event>
            <div class="flex flex-col gap-2 mb-8 ml-2">
              <div class="flex flex-col">
                <span class="font-bold text-surface-900 dark:text-surface-0 text-base">
                  {{ getStatusLabel(event.status) }}
                </span>
                <span class="text-xs text-surface-500 mt-1 flex items-center gap-1">
                  <i class="pi pi-clock text-[10px]"></i>
                  {{ event.timestamp | date:'dd/MM/yyyy HH:mm' }}
                </span>
              </div>

              <div class="mt-1 flex items-center gap-2 text-sm text-surface-700 dark:text-surface-300">
                <div class="w-6 h-6 rounded-full bg-surface-100 dark:bg-surface-800 flex items-center justify-center text-surface-500">
                  <i class="pi pi-user text-[10px]"></i>
                </div>
                <span class="font-medium">{{ event.actor }}</span>
              </div>

              @if(event.note) {
                <div class="mt-2 p-3 bg-blue-50 dark:bg-blue-900/20 rounded-lg text-sm text-surface-700 dark:text-surface-300 border border-blue-100 dark:border-blue-800 relative">
                  <div class="absolute -top-2 left-4 text-blue-500 bg-surface-0 dark:bg-surface-900 px-1">
                    <i class="pi pi-comment text-[10px]"></i>
                  </div>
                  {{ event.note }}
                </div>
              }
            </div>
          </ng-template>
        </p-timeline>

      </div>
    </div>
  </div>
  <!-- Actions -->
      <div class="flex justify-end gap-3 mt-2">
        <button pButton type="button" [label]="'guarantee.detail.actions.cancel' | transloco" icon="pi pi-times"
          (click)="close()" severity="secondary" outlined="true"></button>
        <button pButton type="button" (click)="updateGurantee()" [label]="'guarantee.detail.actions.submit' | transloco" icon="pi pi-check"
          [disabled]="guaranteeForm.invalid"></button>
      </div>
</div>
