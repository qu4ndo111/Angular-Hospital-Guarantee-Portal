<app-title [title]="'guarantee.detail.title' | transloco" [menu]="menu"></app-title>
<div class="flex flex-col gap-8 p-6 lg:px-8">
  <div class="bg-surface-0 dark:bg-surface-900 shadow-md rounded-2xl p-6 border border-surface-200 dark:border-surface-700 transition-all hover:shadow-lg">
    <div class="flex items-center gap-3">
      <div
        class="w-10 h-10 rounded-full bg-primary-100 dark:bg-primary-900/40 flex items-center justify-center text-primary-600 dark:text-primary-400">
        <i class="pi pi-file text-xl"></i>
      </div>
      <div class="flex gap-2">
        <h2 class="text-xl font-bold text-surface-900 dark:text-surface-0">{{ 'guarantee.detail.status' | transloco }}</h2>
        <p-tag [value]="getStatusLabel(guaranteeForm.get('status')?.value)" [severity]="getStatusSeverity(guaranteeForm.get('status')?.value)"></p-tag>
      </div>
    </div>
  </div>
  <app-guarantee-form [guaranteeForm]="guaranteeForm"></app-guarantee-form>

  <div>

  </div>
</div>
