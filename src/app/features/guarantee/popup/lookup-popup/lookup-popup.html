<div class="mb-6 border-b border-surface-200 dark:border-surface-700 pb-6">
  <h2 class="text-xl font-bold text-surface-900 dark:text-surface-0 mb-2">{{ 'guarantee.lookupPopup.title' | transloco }}</h2>
  <form class="grid grid-cols-1 md:grid-cols-12 gap-4" [formGroup]="lookupForm" (ngSubmit)="lookup()">
  <div class="md:col-span-3 flex flex-col gap-2">
    <div class="flex items-center gap-2">
      <label class="font-medium text-surface-900 dark:text-surface-0 text-sm">{{ 'guarantee.lookupPopup.cccd' | transloco }}</label>
      <i class="pi pi-id-card"></i>
    </div>
    <span class="p-input-icon-left w-full relative">
      <input type="text" class="w-full" pInputText [placeholder]="'guarantee.lookupPopup.placeholderCccd' | transloco" formControlName="cccd" />
    </span>
  </div>
  <div class="md:col-span-4 flex flex-col gap-2">
    <div class="flex items-center gap-2">
      <label class="font-medium text-surface-900 dark:text-surface-0 text-sm">{{ 'guarantee.lookupPopup.name' | transloco }}</label>
      <i class="pi pi-user"></i>
    </div>
    <span class="p-input-icon-left w-full">
      <input type="text" class="w-full" pInputText [placeholder]="'guarantee.lookupPopup.placeholderName' | transloco" formControlName="name" />
    </span>
  </div>
  <div class="md:col-span-3 flex flex-col gap-2">
    <div class="flex items-center gap-2">
      <label class="font-medium text-surface-900 dark:text-surface-0 text-sm">{{ 'guarantee.lookupPopup.dateOfBirth' | transloco }}</label>
      <i class="pi pi-calendar"></i>
    </div>
    <p-datepicker [fluid]="true" appendTo="body" [placeholder]="'guarantee.lookupPopup.placeholderDate' | transloco" formControlName="dateOfBirth"
      iconDisplay="input"></p-datepicker>
  </div>
  <div class="md:col-span-2 flex items-end">
    <button pButton [disabled]="lookupForm.invalid" type="submit" [label]="'guarantee.lookupPopup.button' | transloco" icon="pi pi-search"
      class="w-full shadow-sm"></button>
  </div>
</form>
</div>
@if(vm$ | async; as vm) {
<app-data-table [loading]="loading()" [value]="vm.patients" [paginator]="false" [columns]="columns"
  selectionMode="single" (rowSelect)="onPatientSelect($event)"></app-data-table>
} @else {
  <div class="flex flex-col items-center justify-center py-12 px-4 rounded-xl border border-dashed border-surface-200 dark:border-surface-700 bg-surface-50/50 dark:bg-surface-900/50 mt-4 animate-fadein duration-500">
    <div class="relative mb-6">
      <div class="absolute -inset-4 bg-primary/10 rounded-full blur-xl animate-pulse"></div>
      <div class="w-20 h-20 bg-surface-0 dark:bg-surface-800 rounded-2xl shadow-lg flex items-center justify-center relative border border-surface-100 dark:border-surface-700">
        <i class="pi pi-search-plus text-4xl text-primary opacity-80"></i>
      </div>
    </div>
    <h3 class="text-xl font-bold text-surface-900 dark:text-surface-0 mb-2">
      {{ 'guarantee.lookupPopup.noData.title' | transloco }}
    </h3>
  </div>
}
<div class="flex justify-end mt-3">
  <button pButton (click)="ref.close()">{{ 'common.actions.close' | transloco }}</button>
</div>
