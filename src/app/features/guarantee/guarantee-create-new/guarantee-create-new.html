<app-title [title]="'guarantee.create.title' | transloco" [menu]="menu"></app-title>

<div class="flex flex-col gap-8 lg:py-6">
  <div
    class="bg-surface-0 dark:bg-surface-900 shadow-md rounded-2xl p-6 border border-surface-200 dark:border-surface-700 transition-all hover:shadow-lg">
    <div class="flex items-center gap-3 mb-6">
      <div
        class="w-10 h-10 rounded-full bg-primary-100 dark:bg-primary-900/40 flex items-center justify-center text-primary-600 dark:text-primary-400">
        <i class="pi pi-search text-xl"></i>
      </div>
      <div>
        <h2 class="text-xl font-bold text-surface-900 dark:text-surface-0">{{ 'guarantee.create.lookupSection.title' | transloco }}</h2>
        <p class="text-surface-500 dark:text-surface-400 text-sm">{{ 'guarantee.create.lookupSection.subtitle' | transloco }}</p>
      </div>
    </div>

    <form class="grid grid-cols-1 md:grid-cols-12 gap-4" [formGroup]="lookupForm" (ngSubmit)="lookup()">
      <div class="md:col-span-3 flex flex-col gap-2 justify-end">
        <div class="flex items-center gap-2 required">
          <label class="font-medium text-surface-900 dark:text-surface-0 text-sm">{{ 'guarantee.lookupPopup.cccd' | transloco }}</label>
          <i class="pi pi-id-card"></i>
        </div>
        <span class="p-input-icon-left w-full relative">
          <input type="text" class="w-full" pInputText [placeholder]="'guarantee.lookupPopup.placeholderCccd' | transloco" formControlName="cccd" />
        </span>
      </div>
      <div class="md:col-span-4 flex flex-col gap-2 justify-end">
        <div class="flex items-center gap-2">
          <label class="font-medium text-surface-900 dark:text-surface-0 text-sm">{{ 'guarantee.lookupPopup.name' | transloco }}</label>
          <i class="pi pi-user"></i>
        </div>
        <span class="p-input-icon-left w-full">
          <input type="text" class="w-full" pInputText [placeholder]="'guarantee.lookupPopup.placeholderName' | transloco" formControlName="name" />
        </span>
      </div>
      <div class="md:col-span-3 flex flex-col gap-2 justify-end">
        <div class="flex items-center gap-2">
          <label class="font-medium text-surface-900 dark:text-surface-0 text-sm">{{ 'guarantee.lookupPopup.dateOfBirth' | transloco }}</label>
          <i class="pi pi-calendar"></i>
        </div>
        <p-datepicker [fluid]="true" [placeholder]="'guarantee.lookupPopup.placeholderDate' | transloco" formControlName="dateOfBirth"
          iconDisplay="input"></p-datepicker>
      </div>
      <div class="md:col-span-2 flex items-end">
        <button pButton [disabled]="lookupForm.invalid" type="submit" [label]="'guarantee.create.lookupSection.button' | transloco" icon="pi pi-search"
          class="w-full shadow-sm"></button>
      </div>
    </form>
  </div>

  <app-guarantee-form [guaranteeForm]="guaranteeForm"></app-guarantee-form>

      <div class="mt-8 flex justify-end gap-3 border-t border-surface-200 dark:border-surface-700 pt-6">
        <button pButton type="button" [label]="'guarantee.create.actions.cancel' | transloco" icon="pi pi-times" (click)="close()"severity="secondary" outlined="true"></button>
        <button pButton type="button" (click)="createNewGurantee()" [label]="'guarantee.create.actions.submit' | transloco" icon="pi pi-check" iconPos="right" [disabled]="guaranteeForm.invalid"></button>
      </div>
</div>
