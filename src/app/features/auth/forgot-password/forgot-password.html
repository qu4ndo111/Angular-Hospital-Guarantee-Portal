<div *transloco="let t">
  <div class="border rounded-lg login-card flex flex-col gap-5" style="padding: 20px 16px;">
    <div class="flex items-center gap-1 back-btn">
      <i class="pi pi-angle-left"></i>
      <a routerLink="/auth/login" class="text-sm cursor-pointer">{{ t('common.back') }}</a>
    </div>
    <div class="text-center text-xl">
      {{ t('auth.login.logo') }}
    </div>
    <div>
      <p class="text-2xl text-center">{{ t('auth.forgotPassword.title') }}</p>
    </div>
    <form [formGroup]="forgotPasswordForm" class="flex flex-col gap-5">
      <div class="flex flex-col gap-2">
        <label for="email">{{ t('auth.forgotPassword.email') }}</label>
        <input type="email" [placeholder]="t('auth.forgotPassword.email')" pInputText id="email" name="email" />
      </div>
      <button pButton type="submit" label="{{ t('auth.forgotPassword.submit') }}" class="w-full" severity="primary"></button>
    </form>
  </div>
</div>
