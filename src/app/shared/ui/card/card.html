@if (!loading) {
<p-card class="stat-card" [ngClass]="{ 'clickable': clickable }" (click)="onClick()">
  <div class="stat-card__body">
    <div class="stat-card__icon-wrap" [style.background-color]="iconBg || null">
      <i [ngClass]="icon"></i>
    </div>
    <p class="stat-card__value">{{ value }}</p>
    <p class="stat-card__label">{{ label }}</p>
  </div>
</p-card>
} @else {
<p-skeleton class="stat-card-skeleton"></p-skeleton>
}
